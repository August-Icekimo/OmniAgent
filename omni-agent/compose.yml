services:
  postgres:
    image: docker.io/pgvector/pgvector:pg18-trixie
    container_name: omni-agent-postgres-1
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-omni}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: ${POSTGRES_DB:-omni_agent}
      TZ: Asia/Taipei
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - ./memory/postgres:/var/lib/postgresql
      - ./db/migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-omni} -d ${POSTGRES_DB:-omni_agent}" ]
      interval: 3s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  gateway:
    build:
      context: ./gateway
    container_name: omni-agent-gateway-1
    env_file:
      - .env
    ports:
      - "${GATEWAY_PORT:-8086}:8086"
    depends_on:
      postgres:
        condition: service_started
    restart: unless-stopped
    environment:
      TZ: Asia/Taipei
    volumes:
      - omni-workspace:/workspace

  brain:
    build:
      context: ./brain
    container_name: omni-agent-brain-1
    env_file:
      - .env
    ports:
      - "${BRAIN_PORT:-8000}:8000"
    volumes:
      - whisper-models:/root/.cache/huggingface
      - ./SOUL.md:/SOUL.md:ro
      - omni-workspace:/workspace
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    environment:
      TZ: Asia/Taipei
      # 終端機技能：brain 透過此內網位址呼叫沙箱 exec 服務
      SANDBOX_URL: http://sandbox:8000

  skills:
    build:
      context: ./skills
    container_name: omni-agent-skills-1
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_started
    restart: unless-stopped

  searxng:
    image: docker.io/searxng/searxng:latest
    container_name: omni-agent-searxng-1
    # 僅 compose 內網可達，不發布 host port（limiter 因此可關閉）
    volumes:
      - ./searxng/settings.yml:/etc/searxng/settings.yml:ro
    environment:
      SEARXNG_SECRET: ${SEARXNG_SECRET:-omni-agent-searxng-secret}
      TZ: Asia/Taipei
    restart: unless-stopped

  sandbox:
    build:
      context: ./sandbox
    container_name: omni-agent-sandbox-1
    # 終端機技能的執行環境：僅 compose 內網可達，不發布 host port。
    # 刻意不掛 .env（隔絕 secret，達成天然 env 刮除）。
    environment:
      TZ: Asia/Taipei
    # 檔案系統唯讀，僅 /sandbox/work 與 tmpfs 可寫
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - sandbox-work:/sandbox/work
    # 資源限制：防失控命令拖垮主機
    mem_limit: 512m
    pids_limit: 256
    # cpus: 1.0 設定 CFS 硬上限（cpu.max），在 rootless podman→docker-compose
    # 相容路徑下會回報 "NanoCPUs can not be set"。改用相對權重 cpu_shares
    # （映射至 cpu.weight），不需 CFS quota，rootless cgroup v2 必定可用。
    cpu_shares: 1024
    # 縮小攻擊面：禁止提權
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

volumes:
  omni-workspace:
  sandbox-work:
  whisper-models:
