description = "Capture an idea into openspec/backlog/ideas/"

prompt = """
Capture a new idea into `openspec/backlog/ideas/`.

**Input**: free-text description or kebab-case slug. Optional flags: `--domain`, `--why`, `--what`.

**Steps**

1. No description → ask what the idea is.
2. Derive a kebab-case slug. If `<slug>.md` exists in `openspec/backlog/ideas/`, `openspec/backlog/ready/`, or any `openspec/backlog/sprints/*.md` Committed/Stretch table, abort: "Slug `<slug>` already exists. Please use a different name or refine the idea."
3. Ask for any missing required field:
   - `domain` — one of `brain`, `gateway`, `identity`, `llm`, `memory`, `security`, `skills`, `soul` (re-ask if invalid)
   - `why` — the pain point or motivation
   - `what` — the high-level goal
4. Write `openspec/backlog/ideas/<slug>.md` from `openspec/backlog/_templates/item.md`, frontmatter: `slug`, `status: idea`, `created: <YYYY-MM-DD>`, `domain`, `why`, `what`.
5. Print the relative path and a one-line summary.
"""
